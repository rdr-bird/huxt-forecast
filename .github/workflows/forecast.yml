name: HUXt CME forecast

on:
  schedule:
    - cron: '17 */3 * * *'        # 3 tunnin välein (UTC). Skripti ajaa ensemblen vain, kun CME:t muuttuvat
  workflow_dispatch:               # tai edellisestä ajosta on yli 12 h.
    inputs:
      force:
        description: 'Aja ensemble vaikka CME:t eivät olisi muuttuneet'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: huxt-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          grep -v '^huxt' requirements.txt > req-deps.txt
          pip install -r req-deps.txt
          pip install --no-deps "$(grep '^huxt' requirements.txt)"

      - name: Aja ennuste
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          HUXT_MEMBERS: ${{ vars.HUXT_MEMBERS || '500' }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then python forecast.py --force; else python forecast.py; fi

      - name: Tiivistelmä huomautuksiksi
        if: always()
        run: |
          python - <<'PY'
          import json, os
          try:
              d = json.load(open('docs/huxt_forecast.json'))
          except Exception as e:
              print(f"::warning::Tulostiedostoa ei voitu lukea: {e}"); raise SystemExit
          print(f"::notice::Ajo {d.get('generated')} | jäseniä {d.get('members')} | {d.get('runtime_s')} s | tausta: {'; '.join(d.get('ambient_source') or [])}")
          dg = d.get('diagnostics') or {}
          for w in dg.get('warnings', []): print(f"::warning::{w}")
          print(f"::notice::Syötteet: {json.dumps({k: v for k, v in dg.items() if k != 'warnings'}, ensure_ascii=False)[:900]}")
          for c in d.get('cmes', []):
              if c.get('hit_pct'):
                  print(f"::notice::CME {c['id'][:16]} {c['v']:.0f} km/s lon {c['lon']:.0f}: osuma {c['hit_pct']} %, mediaani {c.get('arrival_median')}, 5-95 % {c.get('arrival_p5')} – {c.get('arrival_p95')}, {c.get('speed_at_earth_median')} km/s, {c.get('status')}")
          PY

      - name: Tallenna tulos, jos muuttui
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/huxt_forecast.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."; exit 0
          fi
          git commit -m "HUXt-ennuste $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if out=$(git pull --rebase --quiet origin main 2>&1 && git push origin HEAD:main 2>&1); then
              echo "$out"; exit 0
            fi
            echo "::warning::push yritys $i epäonnistui: $(echo "$out" | tr '\n' ' ' | cut -c1-400)"
            sleep 5
          done
          echo "::error::Tuloksen tallennus repoon epäonnistui (ks. varoitukset)"
          exit 1
