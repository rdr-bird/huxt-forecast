name: HUXt CME forecast

on:
  schedule:
    - cron: '17 */3 * * *'        # 3 tunnin välein (UTC). Skripti ajaa ensemblen vain, kun CME:t muuttuvat
  workflow_dispatch:               # tai edellisestä ajosta on yli 12 h.
    inputs:
      force:
        description: 'Aja ensemble vaikka CME:t eivät olisi muuttuneet'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: huxt-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          grep -v '^huxt' requirements.txt > req-deps.txt
          pip install -r req-deps.txt
          pip install --no-deps "$(grep '^huxt' requirements.txt)"

      - name: Aja ennuste
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          HUXT_MEMBERS: ${{ vars.HUXT_MEMBERS || '500' }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then python forecast.py --force; else python forecast.py; fi

      - name: Tallenna tulos, jos muuttui
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/huxt_forecast.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "HUXt-ennuste $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
